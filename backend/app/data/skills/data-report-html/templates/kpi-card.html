<!-- KPI 卡片片段。放进 report-shell.html 的 .kpi-row 里,每个核心指标一张。
     样式类(.kpi-card / .kpi-name / .kpi-value / .kpi-delta)已在 report-shell.html 的 <style> 里预置。
     升色 #16a34a(class="up")、降色 #dc2626(class="down")。数值用千分位。 -->

<!-- 上涨示例 -->
<div class="kpi-card">
  <div class="kpi-name"><!-- 指标名,如 GMV --></div>
  <div class="kpi-value"><!-- 大数值,千分位,如 2,340,000 --></div>
  <div class="kpi-delta up">▲ <!-- 12.3% --> 环比</div>
</div>

<!-- 下跌示例(把 up 换成 down,箭头换 ▼) -->
