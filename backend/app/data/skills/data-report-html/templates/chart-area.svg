<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img">
  <!-- 面积图骨架。画布 720x360；padLeft=60 padTop=20 padRight=20 padBottom=40；plotW=640 plotH=300。基线 y=320。 -->

  <!-- title -->
  <text x="60" y="16" font-size="13" font-weight="600" fill="#111827"><!-- CHART TITLE --></text>

  <!-- y axis grid + ticks: 3-5 档均匀。y = 20 + (1 - tickVal/max)*300 -->
  <line x1="60" y1="20" x2="700" y2="20" stroke="#eceff3"/>
  <line x1="60" y1="170" x2="700" y2="170" stroke="#eceff3"/>
  <line x1="60" y1="320" x2="700" y2="320" stroke="#d0d5dd"/>
  <!-- y 轴刻度文字: <text x="54" y="tickY+4" font-size="11" fill="#6b7280" text-anchor="end">2.3M</text> -->

  <!-- 每个点: x = 60 + (i/(n-1))*640 ;  y = 20 + (1 - v/max)*300 （n=1 时 x=380）
       面积 = 折线的点序列 + 首尾补到基线闭合:
       polygon points = "x0,320  x0,y0 x1,y1 ... x(n-1),y(n-1)  x(n-1),320"
       半透明填充,不描边 -->
  <!-- <polygon fill="#4f8ff7" fill-opacity="0.15" points="60,320 60,y0 ... 700,y(n-1) 700,320"/> -->

  <!-- 顶部实线描边（同折线的点序列,不闭合）: -->
  <!-- <polyline fill="none" stroke="#4f8ff7" stroke-width="2" points="x0,y0 x1,y1 ..."/> -->

  <!-- x labels: <text x="pointX" y="336" font-size="11" fill="#6b7280" text-anchor="middle">label</text> -->
</svg>
