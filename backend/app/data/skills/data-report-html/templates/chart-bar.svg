<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif" role="img">
  <!-- 柱状图骨架。画布 720x360；padLeft=60 padTop=20 padRight=20 padBottom=40；plotW=640 plotH=300。基线 y=320。 -->

  <!-- title -->
  <text x="60" y="16" font-size="13" font-weight="600" fill="#111827"><!-- CHART TITLE --></text>

  <!-- y axis grid + ticks: 3-5 档均匀。tickVal 从 0 到 max。y = 20 + (1 - tickVal/max)*300。数字按 svg-charting-rules 格式化 -->
  <!-- 顶部网格线 (tickVal = max) -->
  <line x1="60" y1="20" x2="700" y2="20" stroke="#eceff3"/>
  <!-- 中间网格线示例 -->
  <line x1="60" y1="170" x2="700" y2="170" stroke="#eceff3"/>
  <!-- 基线 (0 轴) -->
  <line x1="60" y1="320" x2="700" y2="320" stroke="#d0d5dd"/>
  <!-- y 轴刻度文字: <text x="54" y="tickY+4" font-size="11" fill="#6b7280" text-anchor="end">1.2M</text> -->

  <!-- bars: slot = 640/n; barW = slot*0.7;
       x = 60 + i*slot + (slot-barW)/2;  barTop = 20 + (1 - v/max)*300;  barH = 320 - barTop
       单 series 用主色 #4f8ff7；多 series 第 i 个用色板第 i%8 色 -->
  <!-- repeat per data point i:
       <rect x=".." y="barTop" width="barW" height="barH" fill="#4f8ff7" rx="2"/> -->

  <!-- x labels（槽中心居中）: <text x="60 + i*slot + slot/2" y="336" font-size="11" fill="#6b7280" text-anchor="middle">label</text> -->

  <!-- legend（多 series 时）: 右上或底部放 <rect .../> + <text fill="#6b7280">series</text> -->
</svg>
