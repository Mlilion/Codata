<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- 报告标题 --></title>
<!-- 图表库:唯一允许的外部资源。图表渲染需要网络,离线时显示 .chart-fallback 文案。 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* 自包含浅色主题。所有色值写死(单文件报告不能用运行时 CSS 变量渲染)。
     背景 #ffffff / #f8fafc；主文字 #111827；次文字 #6b7280；边框 #e5e7eb;
     上涨/成功 #16a34a；下跌/警告 #dc2626；主色 #4f8ff7。 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #111827;
    background: #f8fafc;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .report {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  section { margin-top: 28px; }
  h2 {
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
  }

  /* 1. 报告头 */
  header.report-head { margin-bottom: 8px; }
  header.report-head h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
  header.report-head .subtitle { color: #6b7280; font-size: 14px; margin: 0 0 10px; }
  header.report-head .meta {
    display: flex; flex-wrap: wrap; gap: 8px 20px;
    color: #6b7280; font-size: 13px;
  }

  /* 2. 执行摘要 */
  .summary ul { margin: 0; padding-left: 20px; }
  .summary li { margin-bottom: 6px; }

  /* 3. KPI 卡片行 */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .kpi-card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
  }
  .kpi-card .kpi-name { color: #6b7280; font-size: 13px; margin-bottom: 6px; }
  .kpi-card .kpi-value { font-size: 26px; font-weight: 700; color: #111827; }
  .kpi-card .kpi-delta { font-size: 13px; margin-top: 4px; }
  .kpi-card .kpi-delta.up { color: #16a34a; }
  .kpi-card .kpi-delta.down { color: #dc2626; }

  /* 4. 图表区 */
  .charts { display: grid; gap: 20px; }
  .chart-block {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
  }
  .chart-block .chart { width: 100%; }
  .chart-block .chart-fallback { color: #6b7280; font-size: 13px; padding: 24px; text-align: center; }
  .chart-block .chart-caption { color: #6b7280; font-size: 12px; margin-top: 8px; }
  /* 多图并排:宽屏两列,窄屏单列 */
  .charts .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }

  /* 5. 数据明细表 */
  .detail table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
  }
  .detail th, .detail td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
  .detail th { background: #f8fafc; color: #6b7280; font-weight: 600; text-align: left; }
  .detail td.num, .detail th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .detail tr:last-child td { border-bottom: none; }

  /* 6. 归因与洞察 —— 事实/推断/建议三分 */
  .insights .insight { margin-bottom: 10px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .tag.fact { background: #e8f0fe; color: #4f8ff7; }         /* 事实 = 蓝/中性 */
  .tag.inference { background: #fef1e6; color: #f79f4f; }    /* 推断 = 橙/警示 */
  .tag.recommendation { background: #e7f6ec; color: #16a34a; } /* 建议 = 绿/行动 */

  /* 7. 口径与数据来源声明 */
  .caliber dl { margin: 0; }
  .caliber dt { font-weight: 600; margin-top: 10px; }
  .caliber dd { margin: 2px 0 0; color: #6b7280; font-size: 13px; }
  .caliber .custom-caliber { color: #dc2626; }  /* ⚠️ 自定义口径,未经指标中心验证 */

  /* 8. 风险与待确认 */
  .caveats ul { margin: 0; padding-left: 20px; color: #6b7280; }

  footer { margin-top: 40px; color: #6b7280; font-size: 12px; text-align: center; }

  @media (max-width: 640px) {
    .report { padding: 20px 14px 40px; }
    .kpi-row { grid-template-columns: 1fr; }
    header.report-head h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="report">

  <!-- ============ 1. 报告头(必需) ============ -->
  <header class="report-head">
    <h1><!-- 报告标题 --></h1>
    <p class="subtitle"><!-- 分析主题一句话 --></p>
    <div class="meta">
      <span>数据截至 <!-- YYYY-MM-DD [HH:MM] --></span>
      <span>生成时间 <!-- YYYY-MM-DD --></span>
      <span>数据来源 <!-- 来源系统/库 --></span>
    </div>
  </header>

  <!-- ============ 2. 执行摘要(必需):3-5 条结论,决策者速读 ============ -->
  <section class="summary">
    <h2>执行摘要</h2>
    <ul>
      <!-- <li>要点/结论/关键数字</li> ×3-5 -->
    </ul>
  </section>

  <!-- ============ 3. KPI 卡片行(必需):核心指标 + 环比/同比 ============ -->
  <section>
    <h2>核心指标</h2>
    <div class="kpi-row">
      <!-- 每个核心指标一张卡片,见 templates/kpi-card.html -->
      <!--
      <div class="kpi-card">
        <div class="kpi-name">指标名</div>
        <div class="kpi-value">1,234,567</div>
        <div class="kpi-delta up">▲ 12.3% 环比</div>
      </div>
      -->
    </div>
  </section>

  <!-- ============ 4. 图表区(按需):echarts 交互图,遵循 echarts-charting-rules.md ============ -->
  <section class="charts">
    <h2>趋势与分布</h2>
    <!-- 每张图一个 .chart-block(容器 + 离线兜底文案);多图可包在 .chart-grid 里并排:
    <div class="chart-block">
      <div id="chart-trend" class="chart" style="height:380px;">
        <div class="chart-fallback">图表需要网络加载 echarts,如未显示请检查网络连接。</div>
      </div>
      <div class="chart-caption">图注/口径说明</div>
    </div>
    图表在 <body> 末尾的 <script> 里用 echarts.init(...).setOption(...) 初始化,见文末。
    -->
  </section>

  <!-- ============ 5. 数据明细表(按需):数字右对齐千分位,见 templates/data-table.html ============ -->
  <section class="detail">
    <h2>数据明细</h2>
    <!-- <table> ... </table>;数据量大时只放 Top N 并注明 -->
  </section>

  <!-- ============ 6. 归因与洞察(按需):事实/推断/建议三分 ============ -->
  <section class="insights">
    <h2>归因与洞察</h2>
    <!--
    <p class="insight"><span class="tag fact">事实</span>直接来自查询结果的客观数字与变化</p>
    <p class="insight"><span class="tag inference">推断</span>基于数据的因果/归因判断,可能有其他解释</p>
    <p class="insight"><span class="tag recommendation">建议</span>给业务方的行动项</p>
    -->
  </section>

  <!-- ============ 7. 口径与数据来源声明(必需):可信底座 ============ -->
  <section class="caliber">
    <h2>口径与数据来源</h2>
    <dl>
      <!-- 注册口径:
      <dt>指标名</dt>
      <dd>= 指标中心口径(indicator_code: xxx),来源表 db.table,数据截至 YYYY-MM-DD ✅ 已验证口径</dd>
      -->
      <!-- 自定义口径(必须警示):
      <dt>指标名</dt>
      <dd class="custom-caliber">⚠️ 自定义口径,未经指标中心验证;来源表 db.table,数据截至 YYYY-MM-DD</dd>
      -->
    </dl>
  </section>

  <!-- ============ 8. 风险与待确认(按需):数据质量/口径存疑/样本局限 ============ -->
  <section class="caveats">
    <h2>风险与待确认</h2>
    <ul>
      <!-- <li>需业务方确认的假设 / 数据缺口 / 口径存疑处</li> -->
    </ul>
  </section>

  <footer><!-- 由 Codata 生成 --></footer>

</div>
