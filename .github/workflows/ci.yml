name: Tests & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-policy:
    name: Open-source boundary and release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify open-source boundary tests
        run: npm run verify:open-source-boundary

      - name: Enforce strict open-source boundary
        run: npm run audit:open-source-boundary:strict

      - name: Run release policy tests
        run: node --test scripts/release-workflow.test.mjs scripts/generate-release-manifests.test.mjs scripts/open-source-licenses.test.mjs scripts/verify-bundle.test.mjs scripts/verify-release-site.test.mjs scripts/notarize-macos.test.mjs

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e ".[dev]"

      - name: Run tests
        run: pytest -x --tb=short -q --ignore=tests/test_tool/test_code_execute.py

      - name: Verify bundled Node.js license retention
        run: python scripts/test_download_node.py

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: PDF asset synchronization tests
        run: npm run test:pdf-assets
