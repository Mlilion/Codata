name: Release Desktop

on:
  push:
    tags: ["v*"]

env:
  RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'Mlilion/Codata-releases' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release in public release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN is required to publish to $RELEASE_REPOSITORY."
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft > /tmp/release-is-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-is-draft)" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME already exists in $RELEASE_REPOSITORY and is not a draft."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --draft --title "Codata $GITHUB_REF_NAME" --notes "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --target main --title "Codata $GITHUB_REF_NAME" --notes "$GITHUB_REF_NAME" --draft
          fi

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npx next build
        env:
          DESKTOP_BUILD: "true"
          NEXT_PUBLIC_DESKTOP_BUILD: "true"

      - name: Verify frontend assets
        run: npm run verify:frontend-assets
        env:
          FRONTEND_ASSET_ROOT: frontend/out

      - name: Build backend (PyInstaller)
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller
          pyinstaller codata.spec --noconfirm

      - name: Verify backend bundle
        shell: bash
        run: node scripts/verify-bundle.mjs backend/dist/codata-backend

      - name: Download Node.js runtime
        run: cd backend && python scripts/download_node.py

      - name: Build Tauri
        shell: bash
        run: |
          cd desktop-tauri
          npx @tauri-apps/cli build --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":true}}'

      - name: Upload Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe.sig
          )
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "::error::Expected Windows installer and signature, found ${#assets[@]} file(s)."
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber

  # Temporarily disabled while Codata releases focus on Windows users.
  # Keep the job definition here so macOS packaging can be restored quickly.
  build-macos:
    if: ${{ false }}
    needs: prepare-release
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || vars.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || vars.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID || vars.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || vars.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || vars.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY || vars.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH || vars.APPLE_API_KEY_PATH }}
      APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY || vars.APPLE_API_KEY_PRIVATE_KEY }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            node_platform: Darwin-arm64
          - target: x86_64-apple-darwin
            arch: x64
            node_platform: Darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Require Apple signing and notarization credentials
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed macOS release artifacts."
              missing=1
            fi
          done

          has_apple_id_notary=0
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            has_apple_id_notary=1
          fi

          has_api_key_notary=0
          if [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && { [ -n "${APPLE_API_KEY_PATH:-}" ] || [ -n "${APPLE_API_KEY_PRIVATE_KEY:-}" ]; }; then
            has_api_key_notary=1
          fi

          if [ "$has_apple_id_notary" -ne 1 ] && [ "$has_api_key_notary" -ne 1 ]; then
            echo "::error::macOS notarization credentials are required. Set APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID, or set APPLE_API_ISSUER, APPLE_API_KEY, and APPLE_API_KEY_PATH/APPLE_API_KEY_PRIVATE_KEY."
            missing=1
          fi

          exit "$missing"

      - name: Prepare App Store Connect API key
        if: ${{ env.APPLE_API_KEY_PRIVATE_KEY != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstoreconnect"
          api_key_path="$RUNNER_TEMP/appstoreconnect/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Import Apple Developer Certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n' | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npx next build
        env:
          DESKTOP_BUILD: "true"
          NEXT_PUBLIC_DESKTOP_BUILD: "true"

      - name: Verify frontend assets
        run: npm run verify:frontend-assets
        env:
          FRONTEND_ASSET_ROOT: frontend/out

      - name: Build backend (PyInstaller)
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pyinstaller
          pyinstaller codata.spec --noconfirm

      - name: Sign backend native binaries
        run: scripts/sign-macos-bundle.sh backend/dist/codata-backend "$APPLE_SIGNING_IDENTITY"

      - name: Verify backend bundle
        env:
          # x86_64 artifacts are cross-compiled on the arm64 runner, so the
          # runtime smoke test can't execute the binary natively. Static
          # checks still run. The aarch64 matrix leg runs the full smoke.
          VERIFY_BUNDLE_SKIP_SMOKE: ${{ matrix.arch == 'x64' && '1' || '0' }}
        run: node scripts/verify-bundle.mjs backend/dist/codata-backend

      - name: Download Node.js runtime
        run: cd backend && python3 scripts/download_node.py --platform ${{ matrix.node_platform }}

      - name: Sign Node.js runtime
        run: scripts/sign-macos-bundle.sh backend/resources/nodejs "$APPLE_SIGNING_IDENTITY" desktop-tauri/src-tauri/node.entitlements.plist

      - name: Build Tauri (no notarization)
        run: |
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH APPLE_API_KEY_PRIVATE_KEY
          cd desktop-tauri
          npx @tauri-apps/cli build \
            --target ${{ matrix.target }} \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"targets":["dmg","app"],"createUpdaterArtifacts":false}}'

      - name: Fix PyInstaller framework links in app bundle
        run: |
          APP_BACKEND="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata.app/Contents/Resources/backend"
          echo "Repairing PyInstaller Python.framework symlinks after Tauri resource copy"
          scripts/fix-macos-pyinstaller-frameworks.sh "$APP_BACKEND"

      - name: Sign bundled resource binaries
        run: |
          APP_RESOURCES="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata.app/Contents/Resources"
          scripts/sign-macos-bundle.sh "$APP_RESOURCES/backend" "$APPLE_SIGNING_IDENTITY"
          scripts/sign-macos-bundle.sh "$APP_RESOURCES/nodejs" "$APPLE_SIGNING_IDENTITY" desktop-tauri/src-tauri/node.entitlements.plist

      - name: Re-sign app bundle
        run: |
          APP_PATH="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata.app"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/codata"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"

      - name: Notarize app
        run: |
          APP_PATH="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata.app"
          NOTARY_ZIP="$RUNNER_TEMP/Codata-${{ matrix.arch }}-notarize.zip"

          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            xcrun notarytool submit "$NOTARY_ZIP" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Verify backend inside signed .app
        env:
          # Static-only: the earlier "Verify backend bundle" step already ran the
          # full smoke test against the unpackaged backend.
          VERIFY_BUNDLE_SKIP_SMOKE: "1"
        run: |
          APP_BACKEND="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata.app/Contents/Resources/backend"
          node scripts/verify-bundle.mjs "$APP_BACKEND"

      - name: Regenerate notarized macOS artifacts
        run: |
          BUNDLE_DIR="desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          ARCH="${{ matrix.arch }}"
          TAR_NAME="Codata_${VERSION}_${ARCH}.app.tar.gz"
          DMG_NAME="Codata_${VERSION}_${ARCH}.dmg"
          APP_PATH="$BUNDLE_DIR/macos/Codata.app"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          cd "$BUNDLE_DIR/macos"
          rm -f Codata.app.tar.gz Codata.app.tar.gz.sig Codata_*.app.tar.gz Codata_*.app.tar.gz.sig
          tar -czf "$TAR_NAME" Codata.app
          cd $GITHUB_WORKSPACE

          npx @tauri-apps/cli signer sign "$BUNDLE_DIR/macos/$TAR_NAME"
          test -f "$BUNDLE_DIR/macos/$TAR_NAME.sig"

          rm -f "$BUNDLE_DIR/dmg/"*.dmg
          DMG_STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "Codata" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "$BUNDLE_DIR/dmg/$DMG_NAME"
          rm -rf "$DMG_STAGING"

          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BUNDLE_DIR/dmg/$DMG_NAME"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$BUNDLE_DIR/dmg/$DMG_NAME" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          else
            xcrun notarytool submit "$BUNDLE_DIR/dmg/$DMG_NAME" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          fi
          xcrun stapler staple "$BUNDLE_DIR/dmg/$DMG_NAME"

          spctl --assess --type open --context context:primary-signature --verbose=4 "$BUNDLE_DIR/dmg/$DMG_NAME"
          xcrun stapler validate "$BUNDLE_DIR/dmg/$DMG_NAME"

          ARCHIVE_CHECK=$(mktemp -d)
          tar -xzf "$BUNDLE_DIR/macos/$TAR_NAME" -C "$ARCHIVE_CHECK"
          codesign --verify --deep --strict --verbose=2 "$ARCHIVE_CHECK/Codata.app"
          spctl --assess --type execute --verbose=4 "$ARCHIVE_CHECK/Codata.app"
          xcrun stapler validate "$ARCHIVE_CHECK/Codata.app"
          rm -rf "$ARCHIVE_CHECK"

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata_*.app.tar.gz
            desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Codata_*.app.tar.gz.sig
          )
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "::error::Expected macOS DMG, updater archive, and signature, found ${#assets[@]} file(s)."
            printf '%s\n' "${assets[@]}"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$RELEASE_REPOSITORY" --clobber

  publish:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets for manifest generation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          rm -rf artifacts
          mkdir -p artifacts/windows-bundle
          gh release download "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --dir artifacts/windows-bundle --clobber \
            --pattern "*.exe" \
            --pattern "*.exe.sig"
          find artifacts -type f | sort

      - name: Generate GitHub Release download and updater manifests
        env:
          CODATA_RELEASE_REPOSITORY: ${{ env.RELEASE_REPOSITORY }}
          CODATA_RELEASE_PLATFORMS: windows
        run: node scripts/generate-release-manifests.mjs artifacts

      - name: Upload manifests and publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-site/latest.json release-site/downloads-latest.json --repo "$RELEASE_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --draft=false --latest --title "Codata $GITHUB_REF_NAME" --notes "$GITHUB_REF_NAME"
