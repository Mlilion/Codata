name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate release policy
        run: |
          npm run verify:open-source-boundary
          npm run audit:open-source-boundary:strict
          node --test scripts/release-workflow.test.mjs scripts/generate-release-manifests.test.mjs scripts/open-source-licenses.test.mjs scripts/verify-bundle.test.mjs scripts/notarize-macos.test.mjs scripts/staple-macos.test.mjs

  build:
    name: Build ${{ matrix.platform }}
    needs: release-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            artifact: windows-bundle
            architecture: x64
          - runner: macos-15
            platform: macos-aarch64
            artifact: macos-aarch64-bundle
            architecture: arm64
          - runner: macos-15-intel
            platform: macos-x86_64
            artifact: macos-x64-bundle
            architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ matrix.platform != 'windows' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ matrix.platform != 'windows' && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ matrix.platform != 'windows' && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform != 'windows' && secrets.APPLE_TEAM_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.platform != 'windows' && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY: ${{ matrix.platform != 'windows' && secrets.APPLE_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require and import Apple signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed macOS releases."
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Using Apple ID for notarization."
          elif [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_PRIVATE_KEY" ]; then
            api_key_path="$RUNNER_TEMP/codata-notary-key.p8"
            printf '%s' "$APPLE_API_KEY_PRIVATE_KEY" > "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          else
            echo "::error::Set APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID or APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PRIVATE_KEY for notarization."
            exit 1
          fi
          certificate="$RUNNER_TEMP/codata-certificate.p12"
          keychain="$RUNNER_TEMP/codata-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$certificate"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        run: brew install cairo pango gdk-pixbuf pkg-config
      - name: Install frontend and desktop dependencies
        shell: bash
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix desktop-tauri ci
      - name: Build frontend
        run: npm --prefix frontend run build
        env:
          DESKTOP_BUILD: "true"
          NEXT_PUBLIC_DESKTOP_BUILD: "true"
      - name: Verify frontend assets
        run: npm run verify:frontend-assets
        env:
          FRONTEND_ASSET_ROOT: frontend/out
      - name: Build backend (PyInstaller)
        shell: bash
        run: |
          cd backend
          python -m pip install -r requirements.txt pyinstaller
          if [[ "${{ matrix.platform }}" == "macos-x86_64" ]]; then
            python -m pip install --force-reinstall --no-deps --only-binary=:all: "cryptography==48.0.1"
            python -c "import cryptography; assert cryptography.__version__ == '48.0.1', f'Intel macOS build requires cryptography 48.0.1, got {cryptography.__version__}'"
          fi
          python -m PyInstaller codata.spec --noconfirm
      - name: Verify backend bundle
        shell: bash
        run: node scripts/verify-bundle.mjs backend/dist/codata-backend
      - name: Download Node.js runtime
        shell: bash
        run: |
          cd backend
          python scripts/download_node.py
          test -s resources/nodejs/LICENSE
      - name: Sign macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          bash scripts/sign-macos-bundle.sh backend/dist/codata-backend "$APPLE_SIGNING_IDENTITY"
          bash scripts/sign-macos-bundle.sh backend/resources/nodejs "$APPLE_SIGNING_IDENTITY" desktop-tauri/src-tauri/node.entitlements.plist
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd desktop-tauri
          npx --no-install tauri build --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          installers=(desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one Windows installer, found ${#installers[@]}."
            exit 1
          fi
          mkdir -p artifacts/windows-bundle
          cp "${installers[0]}" artifacts/windows-bundle/
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          cd desktop-tauri
          npx --no-install tauri build --bundles app --config '{"build":{"beforeBuildCommand":""}}'
      - name: Repair, Developer ID sign, and verify macOS application
        if: runner.os == 'macOS'
        run: |
          app=desktop-tauri/src-tauri/target/release/bundle/macos/Codata.app
          bash scripts/fix-macos-pyinstaller-frameworks.sh "$app/Contents/Resources/backend"
          bash scripts/sign-macos-bundle.sh "$app/Contents/Resources/backend" "$APPLE_SIGNING_IDENTITY"
          bash scripts/sign-macos-bundle.sh "$app/Contents/Resources/nodejs" "$APPLE_SIGNING_IDENTITY" desktop-tauri/src-tauri/node.entitlements.plist
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app/Contents/MacOS/codata"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Notarize and staple macOS application
        if: runner.os == 'macOS'
        run: |
          app=desktop-tauri/src-tauri/target/release/bundle/macos/Codata.app
          archive="$RUNNER_TEMP/Codata-notarize.zip"
          ditto -c -k --keepParent "$app" "$archive"
          bash scripts/notarize-macos.sh "$archive"
          bash scripts/staple-macos.sh "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Verify backend inside signed application
        if: runner.os == 'macOS'
        env:
          VERIFY_BUNDLE_SKIP_SMOKE: "1"
        run: |
          app=desktop-tauri/src-tauri/target/release/bundle/macos/Codata.app
          node scripts/verify-bundle.mjs "$app/Contents/Resources/backend"
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        env:
          ARTIFACT_DIRECTORY: ${{ matrix.artifact }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          app=desktop-tauri/src-tauri/target/release/bundle/macos/Codata.app
          staging="$RUNNER_TEMP/codata-dmg"
          mkdir -p "$staging" "artifacts/$ARTIFACT_DIRECTORY"
          ditto "$app" "$staging/Codata.app"
          ln -s /Applications "$staging/Applications"
          dmg="artifacts/$ARTIFACT_DIRECTORY/Codata_${GITHUB_REF_NAME#v}_${PACKAGE_ARCHITECTURE}.dmg"
          hdiutil create -volname Codata -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          bash scripts/notarize-macos.sh "$dmg"
          bash scripts/staple-macos.sh "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
      - name: Clean up Apple signing material
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/codata-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/codata-certificate.p12" "$RUNNER_TEMP/codata-notary-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified desktop installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release download manifest
        env:
          CODATA_RELEASE_PLATFORMS: windows,macos
        run: node scripts/generate-release-manifests.mjs artifacts
      - name: Publish release to this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          windows=(artifacts/windows-bundle/*.exe)
          arm=(artifacts/macos-aarch64-bundle/*.dmg)
          intel=(artifacts/macos-x64-bundle/*.dmg)
          if [ "${#windows[@]}" -ne 1 ] || [ "${#arm[@]}" -ne 1 ] || [ "${#intel[@]}" -ne 1 ]; then
            echo "::error::All three validated desktop installers are required before publishing."
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Initial open-source release of Codata.

          Downloads: Windows x64, macOS Apple Silicon, and macOS Intel.
          macOS applications and DMGs are Developer ID signed, notarized by Apple,
          and stapled. The Windows installer is unsigned; SmartScreen may warn.
          Only install artifacts from this repository if you trust the project.
          Automatic updates are disabled; install subsequent releases manually.
          Model providers, keys, and MCP data sources must be configured by users.
          NOTES
          assets=("${windows[0]}" "${arm[0]}" "${intel[0]}" release-site/downloads-latest.json)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Codata $GITHUB_REF_NAME" --notes-file release-notes.txt --latest
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Codata $GITHUB_REF_NAME" --notes-file release-notes.txt --latest
          fi
