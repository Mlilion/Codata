<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codata 下载</title>
  <style>
    :root {
      --color-primary: #d97757;
      --color-primary-dark: #c46545;
      --color-primary-soft: rgba(217, 119, 87, 0.1);
      --color-accent: #2f6f64;
      --color-accent-soft: rgba(47, 111, 100, 0.1);
      --color-blue: #3f6f9f;
      --color-blue-soft: rgba(63, 111, 159, 0.1);
      --color-warning: #a56a18;
      --color-warning-soft: rgba(165, 106, 24, 0.11);
      --color-danger: #a64235;
      --color-danger-soft: rgba(166, 66, 53, 0.1);
      --color-bg: #faf9f5;
      --color-bg-alt: #f5f3ed;
      --color-bg-white: #ffffff;
      --color-text: #29261b;
      --color-text-secondary: #5a5549;
      --color-text-muted: #8a8577;
      --color-border: #e5e2d9;
      --shadow-sm: 0 2px 8px rgba(41, 38, 27, 0.06);
      --shadow-md: 0 4px 20px rgba(41, 38, 27, 0.1);
      --shadow-lg: 0 8px 40px rgba(41, 38, 27, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .hero {
      text-align: center;
      max-width: 900px;
      width: 100%;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      box-shadow: var(--shadow-md);
    }

    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 18px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }

    #version {
      font-size: 15px;
      color: var(--color-text-muted);
      margin-bottom: 40px;
      min-height: 22px;
    }

    #cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .dl-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 260px;
      padding: 24px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .dl-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-primary);
    }

    .dl-icon {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .dl-label {
      font-size: 17px;
      font-weight: 600;
      color: var(--color-text);
    }

    .dl-file {
      font-size: 13px;
      color: var(--color-text-muted);
      word-break: break-all;
    }

    .dl-arch {
      font-size: 12px;
      color: var(--color-text-secondary);
      background: var(--color-primary-soft);
      color: var(--color-primary-dark);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      margin-top: 4px;
    }

    .doc-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--color-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-sm);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .doc-btn:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
    }

    #fallback {
      display: none;
      margin-bottom: 40px;
      padding: 20px 24px;
      background: var(--color-warning-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-secondary);
      font-size: 15px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    #fallback a {
      color: var(--color-primary-dark);
      font-weight: 600;
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      .dl-card { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="logo">C</div>
    <h1>Codata</h1>
    <p class="tagline">面向企业的数据智能桌面应用</p>
    <p id="version">正在获取最新版本…</p>

    <div id="cards">
      <a class="dl-card" id="dl-macos-aarch64" href="#">
        <span class="dl-icon">🍎</span>
        <span class="dl-label">macOS (Apple Silicon)</span>
        <span class="dl-file">—</span>
        <span class="dl-arch">Apple Silicon</span>
      </a>
      <a class="dl-card" id="dl-macos-x86_64" href="#">
        <span class="dl-icon">🍎</span>
        <span class="dl-label">macOS (Intel)</span>
        <span class="dl-file">—</span>
        <span class="dl-arch">Intel x86_64</span>
      </a>
      <a class="dl-card" id="dl-windows-x86_64" href="#">
        <span class="dl-icon">🪟</span>
        <span class="dl-label">Windows</span>
        <span class="dl-file">—</span>
        <span class="dl-arch">x86_64</span>
      </a>
    </div>

    <div id="fallback">
      暂时无法获取下载信息,请前往
      <a href="https://github.com/Mlilion/Codata/releases/latest">GitHub Releases 页面</a>
      手动下载最新版本。
    </div>

    <a class="doc-btn" href="guide.html">查看完整文档</a>

    <footer>© Codata · 企业内部数据智能工具</footer>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const MANIFEST = "https://github.com/Mlilion/Codata/releases/latest/download/downloads-latest.json";
      const RELEASES = "https://github.com/Mlilion/Codata/releases/latest";
      const map = {
        "macos-aarch64": "dl-macos-aarch64",
        "macos-x86_64": "dl-macos-x86_64",
        "windows-x86_64": "dl-windows-x86_64",
      };
      try {
        const res = await fetch(MANIFEST, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        document.getElementById("version").textContent = `版本 v${data.version}`;
        for (const [key, id] of Object.entries(map)) {
          const d = data.downloads?.[key];
          const el = document.getElementById(id);
          if (d && el) {
            el.href = d.url;
            el.querySelector(".dl-label").textContent = d.label;
            el.querySelector(".dl-file").textContent = d.filename;
          } else if (el) {
            el.remove();
          }
        }
      } catch (e) {
        document.getElementById("cards").style.display = "none";
        const fb = document.getElementById("fallback");
        fb.style.display = "block";
        fb.querySelector("a").href = RELEASES;
      }
    });
  </script>
</body>
</html>
